name: Fix solares quick filter

on:
  push:
    paths:
      - '.github/workflows/fix-solares-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect Solares button to solar category
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/public/Properties.jsx')
          text = path.read_text()
          old = "{ value: 'land', label: 'Solares', hint: 'Inversión', icon: Map },"
          new = "{ value: 'lot', label: 'Solares', hint: 'Inversión', icon: Map },"
          if old not in text:
              raise SystemExit('Expected Solares quick category mapping was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public/Properties.jsx
          git diff --cached --check
          git commit -m "Fix Solares quick category filter"
          git push
