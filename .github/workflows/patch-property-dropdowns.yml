name: Patch property dropdown fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dropdown configuration
        run: |
          printf '%s' '' | base64 -d > /tmp/patch_dropdowns.py
          python /tmp/patch_dropdowns.py
          node --check src/config/propertyWorkspace.es.js

      - name: Commit dropdown improvements
        run: |
          rm -f .github/workflows/patch-property-dropdowns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/propertyWorkspace.es.js .github/workflows/patch-property-dropdowns.yml
          git commit -m "Use dropdowns for categorical property characteristics"
          git push
