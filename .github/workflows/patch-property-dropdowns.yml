  ['1_3', '1 a 3 km'], ['over_3', 'Más de 3 km'],
];
const beachDistanceOptions = [
  ['front', 'Frente al mar'], ['under_100', 'Menos de 100 m'], ['100_300', '100 a 300 m'],
  ['300_500', '300 a 500 m'], ['500_1000', '500 m a 1 km'], ['over_1000', 'Más de 1 km'],
];
const potentialOptions = [
  ['low', 'Bajo'], ['medium', 'Medio'], ['high', 'Alto'], ['very_high', 'Muy alto'],
];
const coastalOptions = [
  ['protected', 'Zona protegida'], ['semi_protected', 'Semiprotegida'], ['exposed', 'Expuesta'], ['unknown', 'No evaluada'],
];
'''
          if 'const roofTypeOptions' not in text:
              text = text.replace(marker, marker + option_sets)

          replacements = {
            "field('roofType', 'Tipo de techo')": "field('roofType', 'Tipo de techo', 'select', roofTypeOptions)",
            "field('constructionStatus', 'Estado de la construcción')": "field('constructionStatus', 'Estado de la construcción', 'select', constructionStatusOptions)",
            "field('security', 'Sistema de seguridad')": "field('security', 'Sistema de seguridad', 'select', securityOptions)",
            "field('security', 'Seguridad')": "field('security', 'Seguridad', 'select', securityOptions)",
            "field('viewType', 'Tipo de vista')": "field('viewType', 'Tipo de vista', 'select', viewOptions)",
            "field('waterSource', 'Fuente adicional de agua')": "field('waterSource', 'Fuente adicional de agua', 'select', waterSourceOptions)",
            "field('vehicleAccess', 'Acceso vehicular')": "field('vehicleAccess', 'Acceso vehicular', 'select', accessOptions)",
            "field('naturalEnvironment', 'Entorno natural')": "field('naturalEnvironment', 'Entorno natural', 'select', environmentOptions)",
            "field('potentialUse', 'Uso potencial', 'textarea')": "field('potentialUse', 'Uso potencial', 'select', landUseOptions)",
            "field('soilType', 'Tipo de suelo')": "field('soilType', 'Tipo de suelo', 'select', soilOptions)",
            "field('streetType', 'Tipo de calle')": "field('streetType', 'Tipo de calle', 'select', streetOptions)",
            "field('accessType', 'Tipo de acceso')": "field('accessType', 'Tipo de acceso', 'select', accessOptions)",
            "field('utilitiesAtLot', 'Servicios al pie del terreno', 'textarea')": "field('utilitiesAtLot', 'Servicios al pie del terreno', 'select', utilitiesOptions)",
            "field('drainage', 'Condición de drenaje')": "field('drainage', 'Condición de drenaje', 'select', drainageOptions)",
            "field('zoning', 'Uso de suelo / zonificación')": "field('zoning', 'Uso de suelo / zonificación', 'select', zoningOptions)",
            "field('documentation', 'Documentación disponible', 'textarea')": "field('documentation', 'Documentación disponible', 'select', documentationOptions)",
            "field('topography', 'Topografía')": "field('topography', 'Topografía', 'select', topographyOptions)",
            "field('landShape', 'Forma del solar')": "field('landShape', 'Forma del solar', 'select', landShapeOptions)",
            "field('accessType', 'Acceso')": "field('accessType', 'Acceso', 'select', accessOptions)",
            "field('utilitiesAtLot', 'Servicios al pie del solar', 'textarea')": "field('utilitiesAtLot', 'Servicios al pie del solar', 'select', utilitiesOptions)",
            "field('documentation', 'Documentación', 'textarea')": "field('documentation', 'Documentación', 'select', documentationOptions)",
            "field('streetType', 'Tipo de camino')": "field('streetType', 'Tipo de camino', 'select', streetOptions)",
            "field('waterSource', 'Río, quebrada o fuente de agua')": "field('waterSource', 'Río, quebrada o fuente de agua', 'select', waterSourceOptions)",
            "field('crops', 'Cultivos actuales')": "field('crops', 'Cultivos actuales', 'select', cropOptions)",
            "field('potentialUse', 'Potencial de la finca', 'textarea')": "field('potentialUse', 'Potencial de la finca', 'select', farmUseOptions)",
            "field('trafficLevel', 'Nivel de tráfico')": "field('trafficLevel', 'Nivel de tráfico', 'select', trafficOptions)",
            "field('pedestrianFlow', 'Flujo peatonal')": "field('pedestrianFlow', 'Flujo peatonal', 'select', trafficOptions)",
            "field('commercialZone', 'Zona comercial')": "field('commercialZone', 'Zona comercial', 'select', commercialZoneOptions)",
            "field('permittedUse', 'Uso permitido')": "field('permittedUse', 'Uso permitido', 'select', permittedUseOptions)",
            "field('floorCapacity', 'Capacidad / tipo de piso')": "field('floorCapacity', 'Capacidad / tipo de piso', 'select', floorOptions)",
            "field('industrialZone', 'Zona industrial o comercial')": "field('industrialZone', 'Zona industrial o comercial', 'select', commercialZoneOptions)",
            "field('connectivity', 'Internet y conectividad')": "field('connectivity', 'Internet y conectividad', 'select', connectivityOptions)",
            "field('corporateLocation', 'Entorno corporativo')": "field('corporateLocation', 'Entorno corporativo', 'select', corporateLocationOptions)",
            "field('occupancyStatus', 'Estado de ocupación')": "field('occupancyStatus', 'Estado de ocupación', 'select', occupancyOptions)",
            "field('maintenanceCondition', 'Estado general de mantenimiento')": "field('maintenanceCondition', 'Estado general de mantenimiento', 'select', maintenanceOptions)",
            "field('occupancyStatus', 'Estado de operación')": "field('occupancyStatus', 'Estado de operación', 'select', occupancyOptions)",
            "field('projectType', 'Tipo de proyecto')": "field('projectType', 'Tipo de proyecto', 'select', projectTypeOptions)",
            "field('projectStage', 'Etapa actual del proyecto')": "field('projectStage', 'Etapa actual del proyecto', 'select', projectStageOptions)",
            "field('potentialUse', 'Uso potencial')": "field('potentialUse', 'Uso potencial', 'select', landUseOptions)",
            "field('existingPermits', 'Permisos existentes')": "field('existingPermits', 'Permisos existentes', 'select', permitOptions)",
            "field('availableStudies', 'Estudios disponibles')": "field('availableStudies', 'Estudios disponibles', 'select', studiesOptions)",
            "field('infrastructureStatus', 'Infraestructura disponible')": "field('infrastructureStatus', 'Infraestructura disponible', 'select', infrastructureOptions)",
            "field('capitalGainProjection', 'Proyección de plusvalía')": "field('capitalGainProjection', 'Proyección de plusvalía', 'select', capitalGainOptions)",
            "field('mainRoadsProximity', 'Cercanía a vías principales')": "field('mainRoadsProximity', 'Cercanía a vías principales', 'select', roadProximityOptions)",
            "field('beachDistance', 'Distancia al mar')": "field('beachDistance', 'Distancia al mar', 'select', beachDistanceOptions)",
            "field('rentalPotential', 'Potencial de alquiler vacacional', 'textarea')": "field('rentalPotential', 'Potencial de alquiler vacacional', 'select', potentialOptions)",
            "field('coastalProtection', 'Condición / protección costera')": "field('coastalProtection', 'Condición / protección costera', 'select', coastalOptions)",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # Solar topography was originally plain text; ensure it uses the standard list.
          text = text.replace("field('topography', 'Topografía', 'select', [\n      ['flat', 'Plana'],", "field('topography', 'Topografía', 'select', [\n      ['flat', 'Plana'],", 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check src/config/propertyWorkspace.es.js

      - name: Commit dropdown improvements
        run: |
          rm -f .github/workflows/patch-property-dropdowns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/propertyWorkspace.es.js .github/workflows/patch-property-dropdowns.yml
          git commit -m "Use dropdowns for categorical property characteristics"
          git push
