name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source
        run: npm run lint

      - name: Build site for GitHub Pages
        run: npm run build:pages

      - name: Verify requested changes
        run: |
          touch docs/.nojekyll
          test -s docs/index.html
          grep -q "Bienes raíces" src/content/homePage.es.js
          grep -q "property-workspace-simplified.css" src/main.jsx
          grep -q "property-marketing" src/styles/property-workspace-simplified.css
          grep -q "Referencia de trabajo para la administradora" src/styles/property-workspace-simplified.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Write deployment summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## GitHub Pages deployment"
            echo
            echo "- SHA: \`${DEPLOYED_SHA}\`"
            echo "- Build: **${BUILD_RESULT}**"
            echo "- Deploy: **${DEPLOY_RESULT}**"
            echo "- Run ID: \`${RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
