name: Audit cards and footer once

on:
  push:
    branches:
      - audit/cards-footer-20260805

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/cards-footer-20260805

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24

      - name: Inspect exact cards and footer
        run: node ./audit-cards-footer.mjs
