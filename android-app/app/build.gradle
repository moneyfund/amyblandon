plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amyblandon.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amyblandon.admin.preview'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        preview {
            storeFile file('amy-preview.jks')
            storePassword 'AmyPreview2026'
            keyAlias 'amy-preview'
            keyPassword 'AmyPreview2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.preview
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
