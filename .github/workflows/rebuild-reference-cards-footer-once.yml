name: Rebuild reference cards and footer once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/reference-solution-cards-footer-20260805

      - name: Skip generated build commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[pages-build]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          if ! npm ci --no-audit --no-fund; then
            rm -rf node_modules
            rm -f package-lock.json
            npm install --no-audit --no-fund
          fi

      - name: Lint and build GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          npm run lint
          npm run build
          rm -rf docs/assets
          rm -f docs/index.html
          npm run build:pages
          touch docs/.nojekyll

      - name: Verify reference cards and footer
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          JS_FILE=$(find docs/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)
          CSS_FILE=$(find docs/assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)
          test -n "$JS_FILE"
          test -n "$CSS_FILE"
          grep -qi '#f2f4f1' src/styles/reference-cards-footer.css
          grep -qi 'border:2px solid rgba(0,0,0,.07)' src/styles/reference-cards-footer.css
          grep -qi '#001929' src/styles/reference-cards-footer.css
          grep -qi 'grid-template-columns:repeat(3' src/styles/reference-cards-footer.css
          grep -qi 'scroll-snap-type:inline mandatory' src/styles/reference-cards-footer.css
          grep -qi 'reference-cards-footer' src/main.jsx
          grep -q 'amyblandon.firebaseapp.com' "$JS_FILE"
          grep -qi '#f2f4f1' "$CSS_FILE"
          grep -qi '#001929' "$CSS_FILE"
          echo "Generated JS: $JS_FILE"
          echo "Generated CSS: $CSS_FILE"

      - name: Commit generated build
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[pages-build] Publicar tarjetas y footer de referencia'
          git push origin HEAD:feat/reference-solution-cards-footer-20260805
