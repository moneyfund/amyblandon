name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source
        run: npm run lint

      - name: Build site for GitHub Pages
        run: npm run build:pages

      - name: Verify requested changes
        run: |
          touch docs/.nojekyll
          test -s docs/index.html
          grep -q "Bienes raíces" src/content/homePage.es.js
          grep -q "property-workspace-simplified.css" src/main.jsx
          grep -q "property-marketing" src/styles/property-workspace-simplified.css
          grep -q "Referencia de trabajo para la administradora" src/styles/property-workspace-simplified.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record deployment result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .github
          {
            echo "sha=${DEPLOYED_SHA}"
            echo "build=${BUILD_RESULT}"
            echo "deploy=${DEPLOY_RESULT}"
            echo "run_id=${RUN_ID}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/last-pages-deploy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-pages-deploy.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: registrar resultado del despliegue de Pages"
          git push origin HEAD:main
