name: Build trim editor and navigation once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[pages-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if ! npm ci --no-audit --no-fund; then
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi

      - name: Lint and build
        shell: bash
        run: |
          set -e
          npm run lint
          npm run build
          rm -rf docs/assets
          rm -f docs/index.html
          npm run build:pages
          touch docs/.nojekyll
          test -s docs/index.html
          grep -q "Bienes raíces" src/content/homePage.es.js
          grep -q "property-workspace-simplified.css" src/main.jsx
          grep -q 'href="#property-marketing"' src/styles/property-workspace-simplified.css
          grep -q 'Referencia de trabajo para la administradora' src/styles/property-workspace-simplified.css
          grep -q 'property-workspace__checks' src/styles/property-workspace-simplified.css

      - name: Commit generated GitHub Pages build
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[pages-build] Aplicar simplificación del editor y navegación'
          git push origin HEAD:main
