name: Refine featured first page

on:
  push:
    paths:
      - '.github/workflows/refine-featured-first-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep three featured plus six regular properties on page one
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/public/Properties.jsx')
          text = path.read_text()

          old = (
              "  const totalPages = Math.max(1, Math.ceil(filtered.length / PROPERTIES_PER_PAGE));\n"
              "  const pageStart = (currentPage - 1) * PROPERTIES_PER_PAGE;\n"
              "  const pageProperties = filtered.slice(pageStart, pageStart + PROPERTIES_PER_PAGE);\n"
              "  const featured = pageProperties.filter((property) => property.featured);\n"
              "  const standardProperties = featured.length ? pageProperties.filter((property) => !property.featured) : pageProperties;\n"
              "  const hasSearch = Boolean(q || propertyType || operationType === 'rent');\n"
          )
          new = (
              "  const featured = currentPage === 1\n"
              "    ? filtered.filter((property) => property.featured).slice(0, 3)\n"
              "    : [];\n"
              "  const standardPool = filtered.filter((property) => !property.featured);\n"
              "  const totalPages = Math.max(1, Math.ceil(standardPool.length / PROPERTIES_PER_PAGE));\n"
              "  const pageStart = (currentPage - 1) * PROPERTIES_PER_PAGE;\n"
              "  const standardProperties = standardPool.slice(pageStart, pageStart + PROPERTIES_PER_PAGE);\n"
              "  const hasSearch = Boolean(q || propertyType || operationType === 'rent');\n"
          )
          if old not in text:
              raise SystemExit('pagination block not found')
          text = text.replace(old, new, 1)

          old_heading = '<div className="re-subheading"><Sparkles /><div>'
          new_heading = '<div className="re-subheading"><div>'
          if old_heading not in text:
              raise SystemExit('featured heading icon not found')
          text = text.replace(old_heading, new_heading, 1)
          path.write_text(text)

          path = Path('src/components/home/FeaturedProperties.jsx')
          text = path.read_text()
          old_home = 'setProperties(items.filter((property) => Boolean(property.featured)));'
          new_home = 'setProperties(items.filter((property) => Boolean(property.featured)).slice(0, 3));'
          if old_home not in text:
              raise SystemExit('home featured assignment not found')
          text = text.replace(old_home, new_home, 1)
          path.write_text(text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public/Properties.jsx src/components/home/FeaturedProperties.jsx
          git commit -m "Show three featured plus six regular properties"
          git push
