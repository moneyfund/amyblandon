name: Refine property catalog pagination

on:
  push:
    paths:
      - '.github/workflows/refine-property-catalog-pagination.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch catalog, cards and styles import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/public/Properties.jsx')
          text = path.read_text()

          marker = "];\n\nconst normalizeOperation"
          if "const PROPERTIES_PER_PAGE = 6;" not in text:
              if marker not in text:
                  raise SystemExit('pagination constant marker not found')
              text = text.replace(marker, "];\n\nconst PROPERTIES_PER_PAGE = 6;\n\nconst normalizeOperation", 1)

          old = "  const [view, setView] = useState('grid');\n"
          if "currentPage" not in text:
              if old not in text:
                  raise SystemExit('view state not found')
              text = text.replace(old, old + "  const [currentPage, setCurrentPage] = useState(1);\n", 1)

          old = "  const featured = filtered.filter((property) => property.featured);\n  const standardProperties = featured.length ? filtered.filter((property) => !property.featured) : filtered;\n  const hasSearch = Boolean(q || propertyType || operationType === 'rent');\n"
          new = "  const totalPages = Math.max(1, Math.ceil(filtered.length / PROPERTIES_PER_PAGE));\n  const pageStart = (currentPage - 1) * PROPERTIES_PER_PAGE;\n  const pageProperties = filtered.slice(pageStart, pageStart + PROPERTIES_PER_PAGE);\n  const featured = pageProperties.filter((property) => property.featured);\n  const standardProperties = featured.length ? pageProperties.filter((property) => !property.featured) : pageProperties;\n  const hasSearch = Boolean(q || propertyType || operationType === 'rent');\n\n  useEffect(() => {\n    setCurrentPage(1);\n  }, [q, operationType, propertyType]);\n\n  useEffect(() => {\n    if (currentPage > totalPages) setCurrentPage(totalPages);\n  }, [currentPage, totalPages]);\n"
          if "const pageProperties = filtered.slice" not in text:
              if old not in text:
                  raise SystemExit('featured block not found')
              text = text.replace(old, new, 1)

          choose = "  const chooseCategory = (value) => {\n    setPropertyType(value);\n    window.setTimeout(showResults, 80);\n  };\n"
          go = "  const goToPage = (page) => {\n    const nextPage = Math.min(Math.max(page, 1), totalPages);\n    setCurrentPage(nextPage);\n    window.setTimeout(showResults, 40);\n  };\n"
          if "const goToPage = (page)" not in text:
              if choose not in text:
                  raise SystemExit('chooseCategory block not found')
              text = text.replace(choose, choose + go, 1)

          old = "                {standardProperties.length > 0 && <div className=\"properties-grid\">{standardProperties.map((property) => <PropertyCard key={property.id} property={property} />)}</div>}\n              </>}\n"
          pagination = "                {standardProperties.length > 0 && <div className=\"properties-grid\">{standardProperties.map((property) => <PropertyCard key={property.id} property={property} />)}</div>}\n                {totalPages > 1 && (\n                  <nav className=\"re-pagination\" aria-label=\"Páginas de propiedades\">\n                    <button type=\"button\" className=\"re-pagination__button\" disabled={currentPage === 1} onClick={() => goToPage(currentPage - 1)}>Anterior</button>\n                    {Array.from({ length: totalPages }, (_, index) => index + 1).map((pageNumber) => (\n                      <button\n                        type=\"button\"\n                        key={pageNumber}\n                        className={`re-pagination__page ${pageNumber === currentPage ? 'is-active' : ''}`}\n                        aria-current={pageNumber === currentPage ? 'page' : undefined}\n                        aria-label={`Ir a la página ${pageNumber}`}\n                        onClick={() => goToPage(pageNumber)}\n                      >\n                        {pageNumber}\n                      </button>\n                    ))}\n                    <button type=\"button\" className=\"re-pagination__button\" disabled={currentPage === totalPages} onClick={() => goToPage(currentPage + 1)}>Siguiente</button>\n                  </nav>\n                )}\n              </>}\n"
          if "className=\"re-pagination\"" not in text:
              if old not in text:
                  raise SystemExit('catalog render block not found')
              text = text.replace(old, pagination, 1)

          path.write_text(text)

          path = Path('src/components/properties/PropertyCard.jsx')
          text = path.read_text()
          header = "const buildCardFeatures = (property, areaUnit, operationLabel, statusLabel) => {\n  const preferred"
          if "const maxFeatures = property.propertyType === 'investment' ? 4 : 5;" not in text:
              if header not in text:
                  raise SystemExit('feature builder marker not found')
              text = text.replace(header, "const buildCardFeatures = (property, areaUnit, operationLabel, statusLabel) => {\n  const maxFeatures = property.propertyType === 'investment' ? 4 : 5;\n  const preferred", 1)
          text = text.replace("    if (features.length >= 5) return;", "    if (features.length >= maxFeatures) return;", 1)
          text = text.replace("    if (features.length < 5) addFeature(feature);", "    if (features.length < maxFeatures) addFeature(feature);", 1)
          text = text.replace("  return features.slice(0, 5);", "  return features.slice(0, maxFeatures);", 1)
          path.write_text(text)

          path = Path('src/main.jsx')
          text = path.read_text()
          marker = "import './styles/admin-intro-loader.css';\n"
          if "property-catalog-pagination-mobile.css" not in text:
              if marker not in text:
                  raise SystemExit('main import marker not found')
              text = text.replace(marker, marker + "import './styles/property-catalog-pagination-mobile.css';\n", 1)
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public/Properties.jsx src/components/properties/PropertyCard.jsx src/main.jsx
          git commit -m "Paginate property catalog and fix mobile cards"
          git push
