name: One-time Firebase Pages rebuild

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/firebase-pages-build-20260804

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if ! npm ci --no-audit --no-fund; then
            echo "npm ci failed; regenerating dependencies with npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi
          npx vite --version

      - name: Run lint without blocking the required build
        shell: bash
        run: npm run lint || echo "::warning::Lint reported issues; production build will determine whether compilation is valid."

      - name: Build application and GitHub Pages output
        shell: bash
        run: |
          set -e
          npm run build
          rm -rf docs/assets
          rm -f docs/index.html
          npm run build:pages
          touch docs/.nojekyll

      - name: Verify Firebase-enabled production bundle
        shell: bash
        run: |
          set -e
          JS_FILE=$(find docs/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)
          CSS_FILE=$(find docs/assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)
          test -n "$JS_FILE"
          test -n "$CSS_FILE"
          grep -q 'amyblandon.firebaseapp.com' "$JS_FILE"
          grep -q 'amyblandon.firebasestorage.app' "$JS_FILE"
          grep -q 'norvingarcia220@gmail.com' "$JS_FILE"
          grep -q 'admin/login' "$JS_FILE"
          if grep -q 'Firebase is not configured. Admin login is unavailable in demo mode.' "$JS_FILE"; then
            echo 'Old demo-mode bundle detected.'
            exit 1
          fi
          if grep -q 'index-Ddtm6nzK.js' docs/index.html; then
            echo 'docs/index.html still references the obsolete JavaScript bundle.'
            exit 1
          fi
          if grep -q 'index-DarkHero2026.css' docs/index.html; then
            echo 'docs/index.html still references the manually patched legacy CSS.'
            exit 1
          fi
          echo "Generated JS: $JS_FILE"
          echo "Generated CSS: $CSS_FILE"

      - name: Commit generated Pages build
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m '[pages-build] Rebuild GitHub Pages with Firebase admin'
          git push origin HEAD:fix/firebase-pages-build-20260804
