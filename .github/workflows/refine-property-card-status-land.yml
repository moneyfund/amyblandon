name: Refine public property badges and land cards

on:
  push:
    paths:
      - '.github/workflows/refine-property-card-status-land.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine property cards and detail badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))

          card = 'src/components/properties/PropertyCard.jsx'
          replace(
              card,
              "import { Bath, BedDouble, Car, Heart, Ruler, Share2 } from 'lucide-react';",
              "import { Bath, BedDouble, Car, Compass, Heart, Map as MapIcon, MapPin, Ruler, Share2 } from 'lucide-react';",
          )

          replace(
              card,
              "const normalizeOperation = (value) => {\n  if (value === 'venta') return 'sale';\n  if (value === 'renta') return 'rent';\n  return value;\n};",
              "const normalizeOperation = (value) => {\n  if (value === 'venta') return 'sale';\n  if (value === 'renta') return 'rent';\n  return value;\n};\n\nconst terminalStatuses = new Set(['sold', 'rented']);\n\nconst terrainValueLabels = {\n  landType: { urban: 'Urbano', semiurban: 'Semiurbano', semirural: 'Semirrural', rural: 'Rural' },\n  topography: { flat: 'Plana', semiflat: 'Semiplana', sloped: 'Inclinada', mixed: 'Mixta', irregular: 'Irregular' },\n  landShape: { regular: 'Regular', irregular: 'Irregular', rectangular: 'Rectangular', corner: 'Esquinero' },\n};\n\nconst propertyDetailValue = (property, key) => property?.[key] ?? property?.propertyDetails?.[key] ?? '';\nconst terrainValue = (key, value) => terrainValueLabels[key]?.[value] || value;",
          )

          replace(
              card,
              "  const roomFeatures = [\n    hasValue(p.bedrooms) && { icon: BedDouble, value: p.bedrooms, label: 'Habitaciones' },\n    hasValue(p.bathrooms) && { icon: Bath, value: p.bathrooms, label: 'Baños' },\n    hasValue(p.parkingSpaces) && { icon: Car, value: p.parkingSpaces, label: 'Parqueo' },\n  ].filter(Boolean);",
              "  const roomFeatures = [\n    hasValue(p.bedrooms) && { icon: BedDouble, value: p.bedrooms, label: 'Habitaciones' },\n    hasValue(p.bathrooms) && { icon: Bath, value: p.bathrooms, label: 'Baños' },\n    hasValue(p.parkingSpaces) && { icon: Car, value: p.parkingSpaces, label: 'Parqueo' },\n  ].filter(Boolean);\n\n  const isLandCard = ['land', 'lot'].includes(p.propertyType);\n  const landType = propertyDetailValue(p, 'landType');\n  const topography = propertyDetailValue(p, 'topography');\n  const accessType = propertyDetailValue(p, 'accessType');\n  const streetType = propertyDetailValue(p, 'streetType');\n  const landShape = propertyDetailValue(p, 'landShape');\n  const soilType = propertyDetailValue(p, 'soilType');\n  const terrainFeatures = isLandCard ? [\n    hasValue(p.landArea || p.area) && {\n      icon: Ruler,\n      value: `${p.landArea || p.area} ${areaUnit}`,\n      label: 'Área total',\n    },\n    {\n      icon: Compass,\n      value: hasValue(landType) ? terrainValue('landType', landType) : p.propertyType === 'lot' ? 'Solar' : 'Terreno',\n      label: 'Categoría',\n    },\n    hasValue(topography) && { icon: MapIcon, value: terrainValue('topography', topography), label: 'Topografía' },\n    hasValue(accessType) && { icon: MapPin, value: accessType, label: 'Acceso' },\n    hasValue(streetType) && { icon: Car, value: streetType, label: 'Calle' },\n    hasValue(landShape) && { icon: MapIcon, value: terrainValue('landShape', landShape), label: 'Forma' },\n    hasValue(soilType) && { icon: Compass, value: soilType, label: 'Suelo' },\n  ].filter(Boolean).slice(0, 5) : [];\n\n  const primaryFeatures = isLandCard ? terrainFeatures.slice(0, 2) : areaFeatures;\n  const secondaryFeatures = isLandCard ? terrainFeatures.slice(2, 5) : roomFeatures;",
          )

          replace(
              card,
              "          <span className=\"property-card__badge\">{operationLabel}</span>\n          <span className={`property-card__badge property-card__badge--${p.status || 'available'}`}>{statusLabel}</span>",
              "          {!terminalStatuses.has(p.status) && <span className=\"property-card__badge\">{operationLabel}</span>}\n          <span className={`property-card__badge property-card__badge--${p.status || 'available'}`}>{statusLabel}</span>",
          )

          p = Path(card)
          text = p.read_text()
          text = text.replace('(areaFeatures.length > 0 || roomFeatures.length > 0)', '(primaryFeatures.length > 0 || secondaryFeatures.length > 0)', 1)
          text = text.replace('areaFeatures.length > 0', 'primaryFeatures.length > 0', 1)
          text = text.replace('areaFeatures.map((feature)', 'primaryFeatures.map((feature)', 1)
          text = text.replace('roomFeatures.length > 0', 'secondaryFeatures.length > 0', 1)
          text = text.replace('roomFeatures.map((feature)', 'secondaryFeatures.map((feature)', 1)
          p.write_text(text)

          detail = 'src/pages/public/PropertyDetail.jsx'
          replace(
              detail,
              "            <span>{operationLabel}</span>\n            <span>{statusLabel}</span>",
              "            {!['sold', 'rented'].includes(property.status) && <span>{operationLabel}</span>}\n            <span>{statusLabel}</span>",
          )
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/properties/PropertyCard.jsx src/pages/public/PropertyDetail.jsx
          git diff --cached --check
          git commit -m "Refine sold rented badges and land card features"
          git push
