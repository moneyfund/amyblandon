name: Audit Amy reference typography once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/amy-reference-fonts-20260805

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install temporary browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24

      - name: Inspect desktop typography on amyblandon.com
        run: node ./audit-fonts.mjs

      - name: Inspect mobile typography on amyblandon.com
        run: node ./audit-fonts-mobile.mjs
