name: Build property workspace v2 once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/property-workspace-v2-20260806

      - name: Skip generated build commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[pages-build]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          if ! npm ci --no-audit --no-fund; then
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi

      - name: Lint and build
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          npm run lint
          npm run build
          rm -rf docs/assets
          rm -f docs/index.html
          npm run build:pages
          touch docs/.nojekyll
          test -s docs/index.html
          grep -q "PropertyWorkspace" src/routes/AppRoutes.jsx
          grep -q "PropertyMapPicker" src/pages/admin/PropertyWorkspace.jsx
          grep -q "property-workspace.css" src/main.jsx
          ! grep -q "Clientes — Próximamente" src/layouts/AdminLayout.jsx
          ! grep -q "Captación de propiedades — Próximamente" src/layouts/AdminLayout.jsx

      - name: Commit generated GitHub Pages build
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[pages-build] Publicar editor inmobiliario avanzado'
          git push origin HEAD:feature/property-workspace-v2-20260806
